quarkus.copilot.eager-start=false
quarkus.copilot.startup-timeout=30s
quarkus.copilot.agents.museum.response-timeout=180s
quarkus.copilot.agents.accessibility.response-timeout=180s
quarkus.copilot.agents.research.response-timeout=180s
# Optional native overrides: quarkus.copilot.agents.<museum|accessibility|research>.model=<available-model-id>
workshop.browser.headless=true
workshop.browser.timeout-ms=30000
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
quarkus.log.level=WARN
quarkus.index-dependency.workshop.group-id=com.microsoft.copilot.examples
quarkus.index-dependency.workshop.artifact-id=workshop-common
