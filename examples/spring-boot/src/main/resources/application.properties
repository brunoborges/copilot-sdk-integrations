spring.main.web-application-type=none
spring.main.banner-mode=off
copilot.eager-start=false
copilot.startup-timeout=30s
copilot.agents.museum.response-timeout=180s
copilot.agents.accessibility.response-timeout=180s
copilot.agents.research.response-timeout=180s
# Optional native overrides: copilot.agents.<museum|accessibility|research>.model=<available-model-id>
workshop.browser.headless=true
workshop.browser.timeout-ms=30000
