micronaut.application.name=workshop-micronaut
micronaut.copilot.eager-start=false
micronaut.copilot.startup-timeout=30s
micronaut.copilot.agents.museum.response-timeout=180s
micronaut.copilot.agents.accessibility.response-timeout=180s
micronaut.copilot.agents.research.response-timeout=180s
# Optional native overrides: micronaut.copilot.agents.<museum|accessibility|research>.model=<available-model-id>
workshop.browser.headless=true
workshop.browser.timeout-ms=30000
