[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "workshop-fastapi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["copilot-fastapi==0.1.0.dev0", "copilot-workshop-examples==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/workshop_fastapi"]
