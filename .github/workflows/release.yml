name: Release

# Pushing a vX.Y.Z tag (optionally -alpha.N, -beta.N or -rc.N) builds, tests and
# publishes every integration at that version:
#   Java (Maven), .NET (NuGet) and Node.js (npm) -> GitHub Packages
#   Python wheels and sdists                     -> GitHub Release assets
# GitHub Packages has no Python registry, so Python ships as release assets.
# Pull requests that change this workflow, and manual runs, do a dry run that
# builds and packages everything without publishing.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/set-release-version.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
              echo "::error::Release tags must look like v1.2.3 or v1.2.3-rc.1, got $REF_NAME"
              exit 1
            fi
            publish=true
          else
            version="0.0.0-dev.$RUN_NUMBER"
            publish=false
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version (publish: $publish)" >> "$GITHUB_STEP_SUMMARY"

  # copilot-core is a module of every Java reactor; publish it once, here.
  java-core:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/core/pom.xml
      - name: Stamp version
        run: python3 .github/scripts/set-release-version.py "$VERSION" java
      - name: Build, test and publish copilot-core
        shell: bash
        run: |
          set -euo pipefail
          goal=verify
          [[ "$PUBLISH" == true ]] && goal=deploy
          java/spring-boot/mvnw --batch-mode --no-transfer-progress -f java/core/pom.xml \
            org.apache.maven.plugins:maven-source-plugin:3.3.1:jar-no-fork "$goal" \
            "-DaltDeploymentRepository=github::https://maven.pkg.github.com/$GITHUB_REPOSITORY"

  java:
    needs: [version, java-core]
    name: java (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spring-boot
            dir: java/spring-boot
            java: '21'
          - name: quarkus
            dir: java/quarkus
            java: '21'
          - name: micronaut
            dir: java/micronaut
            java: '25'
          - name: camel
            dir: java/camel
            java: '21'
          - name: testcontainers
            dir: testcontainers
            java: '21'
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MVNW: ${{ github.workspace }}/java/spring-boot/mvnw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: |
            ${{ matrix.dir }}/**/pom.xml
            java/core/pom.xml
      - name: Stamp version
        run: python3 .github/scripts/set-release-version.py "$VERSION" java
      - name: Install copilot-core locally
        if: matrix.name != 'testcontainers'
        run: >-
          "$MVNW" --batch-mode --no-transfer-progress -f java/core/pom.xml install -DskipTests
      - name: Build, test and publish ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          goal=verify
          [[ "$PUBLISH" == true ]] && goal=deploy
          # Java reactors include ../core as a module; java-core already published it.
          projects=()
          [[ -d ../core ]] && projects=(-pl '!../core')
          "$MVNW" --batch-mode --no-transfer-progress "${projects[@]}" \
            org.apache.maven.plugins:maven-source-plugin:3.3.1:jar-no-fork "$goal" \
            -DdeployAtEnd=true \
            "-DaltDeploymentRepository=github::https://maven.pkg.github.com/$GITHUB_REPOSITORY"

  dotnet:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet/global.json
      - name: Build, test and pack
        shell: bash
        run: |
          set -euo pipefail
          for solution in dotnet/CopilotSdk.slnx aspire/CopilotSdk.Aspire.slnx; do
            # Each directory's global.json opts into Microsoft.Testing.Platform.
            pushd "$(dirname "$solution")" > /dev/null
            name="$(basename "$solution")"
            dotnet build "$name" -c Release "-p:Version=$VERSION"
            dotnet test --solution "$name" -c Release --no-build
            dotnet pack "$name" -c Release --no-build "-p:Version=$VERSION" -o "$GITHUB_WORKSPACE/artifacts/nuget"
            popd > /dev/null
          done
          ls artifacts/nuget
      - name: Publish to GitHub Packages
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: >-
          dotnet nuget push "artifacts/nuget/*.nupkg"
          --source "https://nuget.pkg.github.com/$OWNER/index.json"
          --api-key "$GITHUB_TOKEN"
          --skip-duplicate

  node:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: nodejs
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: npm ci
      - name: Stamp version
        run: python3 ../.github/scripts/set-release-version.py "$VERSION" node
      - name: Build and test
        run: |
          npm run build
          npm test
      - name: Publish to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          [[ "$PUBLISH" == true ]] || args+=(--dry-run)
          [[ "$PRERELEASE" == true ]] && args+=(--tag next)
          # Dependencies first, so each package's internal dependencies exist when it is published.
          for package in core ai nestjs fastify; do
            npm publish --workspace "packages/$package" "${args[@]}"
          done

  python:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Stamp version
        run: python3 .github/scripts/set-release-version.py "$VERSION" python
      - name: Test
        working-directory: python
        run: |
          uv venv
          uv pip install -e core -e django -e fastapi pytest pytest-asyncio pytest-django httpx
          (cd core && ../.venv/bin/python -m pytest)
          (cd django && ../.venv/bin/python -m pytest)
          (cd fastapi && ../.venv/bin/python -m pytest)
      - name: Build wheels and sdists
        run: |
          for package in core django fastapi; do
            uv build "python/$package" --out-dir dist
          done
          ls dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: [version, java, dotnet, node, python]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-dist
          path: dist
      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cat > notes.md <<EOF
          Every integration is published at version \`$VERSION\`. Installing from GitHub Packages
          requires a GitHub token with \`read:packages\`; see the
          [installation guide]($repo_url#installing-released-packages).

          | Ecosystem | Packages | Registry |
          | --- | --- | --- |
          | Java (Maven) | \`com.microsoft:copilot-core\`, \`copilot-spring-boot-starter\`, \`copilot-quarkus\`, \`copilot-micronaut\`, \`copilot-camel\`, \`copilot-testcontainers\`, and their test modules | \`https://maven.pkg.github.com/$GITHUB_REPOSITORY\` |
          | .NET (NuGet) | \`CopilotSdk.Extensions.Hosting\`, \`CopilotSdk.Aspire\`, \`CopilotSdk.Aspire.Hosting\` | \`https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json\` |
          | Node.js (npm) | \`@brunoborges/copilot-agent-core\`, \`@brunoborges/copilot-ai\`, \`@brunoborges/copilot-nestjs\`, \`@brunoborges/copilot-fastify\` | \`https://npm.pkg.github.com\` |
          | Python | \`copilot-agent-core\`, \`copilot-django\`, \`copilot-fastapi\` | Assets below: \`pip install --find-links $repo_url/releases/expanded_assets/$TAG copilot-fastapi\` |
          EOF
          args=()
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${args[@]}"
