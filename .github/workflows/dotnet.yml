name: .NET

on:
  push:
    branches: [main]
    paths:
      - 'dotnet-core/**'
      - 'dotnet-aspire/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'dotnet-core/**'
      - 'dotnet-aspire/**'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dotnet-core
            dir: dotnet-core
            solution: CopilotSdk.slnx
          - name: dotnet-aspire   # references dotnet-core by project
            dir: dotnet-aspire
            solution: CopilotSdk.Aspire.slnx
    defaults:
      run:
        working-directory: ${{ matrix.dir }}   # global.json opts into Microsoft.Testing.Platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ matrix.dir }}/global.json
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/**/*.csproj
      - name: Build
        run: dotnet build ${{ matrix.solution }} -c Release
      - name: Test
        run: dotnet test --solution ${{ matrix.solution }} -c Release --no-build
