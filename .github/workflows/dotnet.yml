name: .NET

on:
  push:
    branches: [main]
    paths:
      - 'dotnet-core/**'
      - 'dotnet-aspire/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'dotnet-core/**'
      - 'dotnet-aspire/**'
      - '.github/workflows/dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet-core/global.json
      - name: Build core
        working-directory: dotnet-core
        run: dotnet build CopilotSdk.slnx -c Release
      - name: Test core
        working-directory: dotnet-core   # global.json opts into Microsoft.Testing.Platform
        run: dotnet test --solution CopilotSdk.slnx -c Release --no-build
      - name: Build Aspire
        run: dotnet build dotnet-aspire/CopilotSdk.Aspire.slnx -c Release
      - name: Test Aspire
        run: dotnet test dotnet-aspire/CopilotSdk.Aspire.slnx -c Release --no-build
