name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            spring-boot/**/pom.xml
            quarkus/**/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nodejs/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Build Spring Boot documentation site
        working-directory: spring-boot
        run: |
          ./mvnw --batch-mode --no-transfer-progress -pl copilot-spring-boot-site-skin -am install
          ./mvnw --batch-mode --no-transfer-progress -N site
      - name: Build Quarkus documentation site
        working-directory: quarkus
        run: |
          ./mvnw --batch-mode --no-transfer-progress -pl site-skin -am install
          ./mvnw --batch-mode --no-transfer-progress -N site
      - name: Build Node.js documentation site
        working-directory: nodejs
        run: |
          npm ci
          npm run site
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R spring-boot/target/site _site/spring-boot
          cp -R quarkus/target/site _site/quarkus
          cp -R nodejs/site/dist _site/nodejs
          cp .github/pages/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
