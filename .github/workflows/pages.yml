name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            java/spring-boot/**/pom.xml
            java/quarkus/**/pom.xml
            java/core/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            nodejs/package-lock.json
            dotnet/site/package-lock.json
            aspire/site/package-lock.json
            python/django/site/package-lock.json
            python/fastapi/site/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Build Spring Boot documentation site
        working-directory: java/spring-boot
        run: |
          ./mvnw --batch-mode --no-transfer-progress -pl copilot-spring-boot-site-skin -am install
          ./mvnw --batch-mode --no-transfer-progress -N site
      - name: Build Quarkus documentation site
        working-directory: java/quarkus
        run: |
          ./mvnw --batch-mode --no-transfer-progress -pl site-skin -am install
          ./mvnw --batch-mode --no-transfer-progress -N site
      - name: Build Node.js documentation site
        working-directory: nodejs
        run: |
          npm ci
          npm run site
      - name: Build .NET documentation site
        working-directory: dotnet/site
        run: |
          npm ci
          npm run build
      - name: Build Aspire documentation site
        working-directory: aspire/site
        run: |
          npm ci
          npm run build
      - name: Build Django documentation site
        working-directory: python/django/site
        run: |
          npm ci
          npm run build
      - name: Build FastAPI documentation site
        working-directory: python/fastapi/site
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R java/spring-boot/target/site _site/spring-boot
          cp -R java/quarkus/target/site _site/quarkus
          cp -R nodejs/site/dist/nestjs _site/nestjs
          cp -R nodejs/site/dist/fastify _site/fastify
          cp -R dotnet/site/dist _site/dotnet
          cp -R aspire/site/dist _site/aspire
          cp -R python/django/site/dist _site/django
          cp -R python/fastapi/site/dist _site/fastapi
          cp .github/pages/index.html .github/pages/dotnet-bot.png _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
