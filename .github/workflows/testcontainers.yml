name: Testcontainers

on:
  push:
    branches: [main]
    paths:
      - 'testcontainers/**'
      - '.github/workflows/testcontainers.yml'
  pull_request:
    paths:
      - 'testcontainers/**'
      - '.github/workflows/testcontainers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: testcontainers/pom.xml
      - name: Build runtime image
        run: docker build -t copilot-runtime:1.0.105 testcontainers/image
      - name: Test Java integration against the real runtime
        run: mvn --batch-mode --no-transfer-progress -f testcontainers/pom.xml -Pcontainer-tests verify
      - name: Build documentation
        run: mvn --batch-mode --no-transfer-progress -f testcontainers/pom.xml site
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: testcontainers-reports-${{ matrix.os }}
          path: |
            testcontainers/target/surefire-reports/
            testcontainers/target/failsafe-reports/
