name: Python

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv venv
          uv pip install -e core -e django -e fastapi pytest pytest-asyncio pytest-django httpx
      - name: Test core
        working-directory: python/core
        run: ../.venv/bin/python -m pytest
      - name: Test Django
        working-directory: python/django
        run: ../.venv/bin/python -m pytest
      - name: Test Django example
        working-directory: python/django/example
        run: ../../.venv/bin/python manage.py test
      - name: Test FastAPI
        working-directory: python/fastapi
        run: ../.venv/bin/python -m pytest
      - name: Test FastAPI example
        working-directory: python/fastapi/example
        run: ../../.venv/bin/python -m pytest

  site:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [django, fastapi]
    defaults:
      run:
        working-directory: python/${{ matrix.package }}/site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: python/${{ matrix.package }}/site/package-lock.json
      - name: Build documentation site
        run: |
          npm ci
          npm run build
