name: Publish Copilot CLI image

on:
  schedule:
    - cron: '23 6 * * *'
  push:
    branches: [main]
    paths:
      - 'testcontainers/image/**'
      - 'testcontainers/src/**'
      - 'testcontainers/pom.xml'
      - '.github/workflows/publish-copilot-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-copilot-runtime
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      date: ${{ steps.release.outputs.date }}
    steps:
      - name: Resolve newest stable CLI release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh api repos/github/copilot-cli/releases/latest --jq '.tag_name')"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Upstream latest release is not a stable version: $tag"
            exit 1
          fi
          {
            echo "version=$version"
            echo "image=ghcr.io/${REPOSITORY,,}/copilot-runtime"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      CLI_VERSION: ${{ needs.release.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: testcontainers/pom.xml
      - name: Build bundled CLI and runtime harness
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg "COPILOT_VERSION=$CLI_VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" \
            testcontainers/image
      - name: Verify the bundled CLI version and license
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh \
            "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" \
            -c 'test -s /opt/copilot/LICENSE.md && copilot --version'
      - name: Test SDK round trip against the bundled CLI
        run: |
          mvn --batch-mode --no-transfer-progress -f testcontainers/pom.xml \
            -Pcontainer-tests \
            "-Dcopilot.test.image=$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH" verify
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture
        run: docker push "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: publish-copilot-runtime-reports-${{ matrix.arch }}
          path: |
            testcontainers/target/surefire-reports/
            testcontainers/target/failsafe-reports/

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.release.outputs.image }}
      CLI_VERSION: ${{ needs.release.outputs.version }}
      BUILD_DATE: ${{ needs.release.outputs.date }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags only after both architectures pass
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$CLI_VERSION" \
            --tag "$IMAGE:$CLI_VERSION-$BUILD_DATE" \
            --tag "$IMAGE:latest" \
            "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-amd64" \
            "$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-arm64"
          {
            echo "## Copilot CLI for Testcontainers"
            echo
            echo "- Image: \`$IMAGE:$CLI_VERSION\`"
            echo "- Daily build: \`$IMAGE:$CLI_VERSION-$BUILD_DATE\`"
            echo "- Rolling tag: \`$IMAGE:latest\`"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Full CLI and headless runtime are bundled; upstream license and notices are retained."
          } >> "$GITHUB_STEP_SUMMARY"
