name: Spring Boot

on:
  push:
    branches: [main]
    paths:
      - 'spring-boot/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'spring-boot/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: spring-boot

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'spring-boot/**/pom.xml'
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Install documentation skin
        run: ./mvnw --batch-mode --no-transfer-progress -pl copilot-spring-boot-site-skin -am install
      - name: Build documentation site
        run: ./mvnw --batch-mode --no-transfer-progress -N site
